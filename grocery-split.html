<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grocery Split</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #eeede9;
    --text: #1a1a1a;
    --text2: #666660;
    --text3: #999992;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --blue-bg: #e8f0fe;
    --blue: #1a56db;
    --green-bg: #dcfce7;
    --green: #15803d;
    --red-bg: #fee2e2;
    --red: #b91c1c;
    --amber-bg: #fef9c3;
    --amber: #a16207;
    --radius: 10px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --bg2: #2c2c2e; --bg3: #3a3a3c;
      --text: #f5f5f0; --text2: #aeaea8; --text3: #78787a;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --blue-bg: #1e3a8a; --blue: #93c5fd;
      --green-bg: #14532d; --green: #86efac;
      --red-bg: #7f1d1d; --red: #fca5a5;
      --amber-bg: #78350f; --amber: #fde68a;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; min-height: 100dvh; }
  .header { border-bottom: 0.5px solid var(--border); padding: 13px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .header-title { font-size: 15px; font-weight: 600; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.04em; font-weight: 500; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-gray { background: var(--bg2); color: var(--text3); }
  .view { max-width: 480px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h2 { font-size: 19px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
  input[type="text"], input[type="url"], input[type="date"], input[type="number"] {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 9px 11px; font-size: 15px; font-family: inherit; outline: none;
  }
  input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,86,219,0.15); }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { margin-bottom: 14px; }
  .btn { display: block; width: 100%; padding: 11px; font-size: 15px; font-weight: 500; font-family: inherit;
    border: 1px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text);
    cursor: pointer; transition: background 0.12s, opacity 0.12s; text-align: center; }
  .btn:hover:not(:disabled) { background: var(--bg2); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn-primary:hover:not(:disabled) { opacity: 0.85; background: var(--text); }
  .btn-secondary { background: var(--bg2); color: var(--text2); border-color: var(--border); }
  .btn-secondary:hover:not(:disabled) { background: var(--bg3); }
  .btn-success { background: var(--green-bg); color: var(--green); border-color: transparent; }
  .btn-gap { margin-top: 8px; }
  .toggle-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .toggle-btn { padding: 9px; font-size: 15px; font-weight: 500; font-family: inherit; border: 1px solid var(--border2);
    border-radius: var(--radius); background: var(--bg); color: var(--text); cursor: pointer; text-align: center; transition: all 0.12s; }
  .toggle-btn.active { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); border-width: 1.5px; }
  .upload-zone { border: 1.5px dashed var(--border2); border-radius: var(--radius-lg); padding: 1.5rem 1rem;
    text-align: center; cursor: pointer; background: var(--bg2); margin-bottom: 14px; transition: background 0.12s; }
  .upload-zone:hover { background: var(--bg3); }
  .upload-zone.has-image { border-style: solid; border-width: 1px; padding: 0; overflow: hidden; }
  .upload-zone img { width: 100%; display: block; max-height: 300px; object-fit: contain; }
  .upload-icon { font-size: 28px; margin-bottom: 8px; }
  .upload-label { font-size: 13px; color: var(--text2); margin-bottom: 3px; }
  .upload-hint { font-size: 11px; color: var(--text3); }
  .status-msg { font-size: 12px; color: var(--text2); text-align: center; margin-bottom: 10px; }
  .alert { border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .alert-red { background: var(--red-bg); color: var(--red); border: 0.5px solid var(--red); }
  .alert-amber { background: var(--amber-bg); color: var(--amber); border: 0.5px solid var(--amber); }
  .alert-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .debug-toggle { font-size: 11px; color: inherit; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; flex-shrink: 0; font-family: inherit; }
  .debug-pre { font-size: 10px; font-family: monospace; white-space: pre-wrap; word-break: break-all; margin-top: 8px; max-height: 120px; overflow: auto; }
  .table-wrap { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 10px; }
  .table-head { display: grid; grid-template-columns: 1fr 52px 72px 28px; padding: 7px 12px; border-bottom: 0.5px solid var(--border); }
  .table-head span { font-size: 10px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .table-row { display: grid; grid-template-columns: 1fr 52px 72px 28px; padding: 4px 12px; border-bottom: 0.5px solid var(--border); align-items: center; gap: 2px; }
  .table-row input { border: none; background: transparent; padding: 3px 2px; font-size: 13px; color: var(--text); width: 100%; }
  .table-row input:focus { outline: none; background: var(--bg3); border-radius: 4px; }
  .table-row input.right { text-align: right; }
  .del-btn { font-size: 17px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 0; text-align: center; line-height: 1; font-family: inherit; }
  .del-btn:hover { color: var(--red); }
  .table-footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; }
  .add-btn { font-size: 12px; color: var(--blue); background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; font-weight: 500; }
  .add-btn:hover { opacity: 0.75; }
  .total-line { font-size: 14px; font-weight: 600; }
  .split-bar { display: flex; justify-content: space-between; align-items: center;
    background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; margin-bottom: 12px; font-size: 13px; color: var(--text2); }
  .split-bar strong { color: var(--text); font-weight: 600; }
  .split-bar .owe { color: var(--green); font-weight: 600; font-size: 15px; }
  .success-wrap { text-align: center; padding: 2rem 1rem; }
  .success-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--green-bg); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 24px; }
  .img-size { font-size: 11px; color: var(--text3); text-align: right; margin-top: -10px; margin-bottom: 10px; }
  .help-link { font-size: 12px; color: var(--blue); background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; margin-bottom: 16px; display: block; }
  .help-box { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 16px; }
  .help-box pre { font-size: 11.5px; color: var(--text2); white-space: pre-wrap; font-family: monospace; line-height: 1.65; }
</style>
</head>
<body>

<div class="header">
  <span class="header-title">Grocery Split</span>
  <span class="badge badge-gray" id="sheet-badge">NO SHEET</span>
</div>

<div id="app"></div>

<script>
const SCRIPT_HELP = `1. Open your Google Sheet → Extensions → Apps Script
2. Delete any existing code and paste the code below
3. Click Save, then Deploy → New deployment → Web app
4. Execute as: Me · Who has access: Anyone
5. Click Deploy, authorize, and copy the Web App URL

─── Paste into Apps Script ───

function doPost(e) {
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    let sheet = ss.getSheetByName('Groceries') || ss.getActiveSheet();
    if (sheet.getLastRow() === 0) {
      sheet.appendRow(['Buyer','Date','Store','Item','Quantity','Price']);
      sheet.getRange(1,1,1,6).setFontWeight('bold');
    }
    const data = JSON.parse(e.postData.contents);
    data.items.forEach(item => {
      sheet.appendRow([data.buyer, data.date, data.store,
        item.name, item.quantity, parseFloat(item.price)]);
    });
    return ContentService.createTextOutput(JSON.stringify({success:true}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({error:err.message}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;

function loadSettings() {
  try { const s = localStorage.getItem("gs_app"); return s ? JSON.parse(s) : null; } catch { return null; }
}
function saveSettings(s) {
  try { localStorage.setItem("gs_app", JSON.stringify(s)); } catch {}
}

function updateBadge(scriptUrl) {
  const b = document.getElementById("sheet-badge");
  if (scriptUrl) { b.textContent = "SHEETS CONNECTED"; b.className = "badge badge-green"; }
  else { b.textContent = "NO SHEET"; b.className = "badge badge-gray"; }
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ev => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const MAX = 1400;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        const base64 = dataUrl.split(",")[1];
        resolve({ base64, preview: dataUrl, sizeKB: Math.round(base64.length * 0.75 / 1024) });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let state = {
  view: "setup",
  settings: { person1: "Annie", person2: "Boyfriend", scriptUrl: "", apiKey: "" },
  buyer: "",
  imgData: null,
  extracted: null,
  lastEntry: null,
  items: [],
  store: "",
  date: new Date().toISOString().split("T")[0],
  stage: "idle",
  debugInfo: null,
  showDebug: false,
  showHelp: false,
};

const saved = loadSettings();
if (saved) { state.settings = { apiKey: "", ...saved }; state.view = saved.apiKey ? "scan" : "setup"; state.buyer = saved.person1; }
else { state.buyer = state.settings.person1; }
updateBadge(state.settings.scriptUrl);

function render() {
  const app = document.getElementById("app");
  if (state.view === "setup") app.innerHTML = setupHTML();
  else if (state.view === "scan") app.innerHTML = scanHTML();
  else if (state.view === "review") app.innerHTML = reviewHTML();
  else if (state.view === "success") app.innerHTML = successHTML();
  bindEvents();
}

function setupHTML() {
  const s = state.settings;
  return `<div class="view">
    <h2>Setup</h2>
    <p class="subtitle">Configure once — saved in your browser.</p>
    <div class="grid2" style="margin-bottom:14px">
      <div><label>Your name</label><input type="text" id="p1" value="${esc(s.person1)}" placeholder="Your name"/></div>
      <div><label>Partner's name</label><input type="text" id="p2" value="${esc(s.person2)}" placeholder="Partner"/></div>
    </div>
    <div class="field">
      <label>Anthropic API Key <span style="color:var(--red);font-weight:400">*required for scanning</span></label>
      <input type="password" id="apikey" value="${esc(s.apiKey)}" placeholder="sk-ant-..."/>
      <p style="font-size:11px;color:var(--text3);margin-top:5px">Get a free key at <a href="https://console.anthropic.com" target="_blank" style="color:var(--blue)">console.anthropic.com</a> → API Keys. Stored only in your browser.</p>
    </div>
    <div class="field">
      <label>Google Apps Script URL <span style="color:var(--text3);font-weight:400">(optional)</span></label>
      <input type="url" id="url" value="${esc(s.scriptUrl)}" placeholder="https://script.google.com/macros/s/..."/>
    </div>
    <button class="help-link" onclick="toggleHelp()">${state.showHelp ? "Hide setup instructions ↑" : "How to get a script URL →"}</button>
    ${state.showHelp ? `<div class="help-box"><pre>${SCRIPT_HELP}</pre></div>` : ""}
    <button class="btn btn-primary" onclick="saveSetup()">Save & start scanning</button>
  </div>`;
}

function scanHTML() {
  const s = state.settings;
  const scanning = state.stage === "scanning";
  const compressing = state.stage === "compressing";
  const hasErr = state.stage === "error";
  const imgZone = state.imgData
    ? `<div class="upload-zone has-image" onclick="document.getElementById('fileInput').click()"><img src="${state.imgData.preview}" alt="Receipt"/></div><p class="img-size">${state.imgData.sizeKB}KB · tap to replace</p>`
    : `<div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📷</div>
        <p class="upload-label">Tap to upload or photograph receipt</p>
        <p class="upload-hint">iPhone photos, HEIC, JPG, PNG all work</p>
        <p class="upload-hint" style="margin-top:4px">Tip: flat surface + bright light = best results</p>
       </div>`;
  return `<div class="view">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="margin:0">Scan receipt</h2>
      <button onclick="goSetup()" style="font-size:12px;color:var(--text2);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit">Settings</button>
    </div>
    <label>Who paid?</label>
    <div class="toggle-row">
      <button class="toggle-btn${state.buyer===s.person1?' active':''}" onclick="setBuyer('${esc(s.person1)}')">${esc(s.person1)}</button>
      <button class="toggle-btn${state.buyer===s.person2?' active':''}" onclick="setBuyer('${esc(s.person2)}')">${esc(s.person2)}</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" onchange="handleFile(this)"/>
    ${imgZone}
    ${compressing ? `<p class="status-msg">Compressing image…</p>` : ""}
    ${scanning ? `<p class="status-msg">Reading receipt — this takes a few seconds…</p>` : ""}
    ${hasErr && state.debugInfo ? `<div class="alert alert-red">
      <div class="alert-top">
        <span>Scan failed. See details or enter manually below.</span>
        <button class="debug-toggle" onclick="toggleDebug()">${state.showDebug?"hide":"details"}</button>
      </div>
      ${state.showDebug ? `<pre class="debug-pre">${esc(state.debugInfo)}</pre>` : ""}
    </div>` : ""}
    <button class="btn btn-primary" onclick="doScan()" ${!state.imgData||scanning||compressing?"disabled":""}>
      ${scanning ? "Reading…" : "Scan receipt →"}
    </button>
    <button class="btn btn-secondary btn-gap" onclick="goManual()">Skip scan — enter items manually</button>
  </div>`;
}

function reviewHTML() {
  const total = state.items.reduce((s, it) => s + parseFloat(it.price||0), 0);
  const rows = state.items.map((it,i) => `
    <div class="table-row">
      <input type="text" value="${esc(it.name)}" placeholder="Item name" oninput="updateItem(${i},'name',this.value)"/>
      <input type="number" class="right" value="${it.quantity}" oninput="updateItem(${i},'quantity',this.value)" step="1" min="0"/>
      <input type="number" class="right" value="${it.price}" oninput="updateItem(${i},'price',this.value)" step="0.01" min="0"/>
      <button class="del-btn" onclick="delItem(${i})">×</button>
    </div>`).join("");
  const noItems = state.items.length === 0 ? `<p style="font-size:13px;color:var(--text3);text-align:center;padding:14px 12px;border-bottom:0.5px solid var(--border)">No items yet — add them below</p>` : "";
  const btnLabel = state.stage==="sending" ? "Sending…" : state.stage==="done" ? "Logged ✓" : state.settings.scriptUrl ? "Log to Google Sheets" : "Confirm";
  const btnClass = state.stage==="done" ? "btn btn-success" : "btn btn-primary";
  return `<div class="view">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin:0">Review & edit</h2>
      <button onclick="goScan()" style="font-size:12px;color:var(--text2);background:none;border:none;cursor:pointer;font-family:inherit">← Back</button>
    </div>
    <div class="grid2" style="margin-bottom:14px">
      <div><label>Store</label><input type="text" id="store-input" value="${esc(state.store)}" placeholder="Store name" oninput="state.store=this.value"/></div>
      <div><label>Date</label><input type="date" id="date-input" value="${state.date}" oninput="state.date=this.value"/></div>
    </div>
    <div class="table-wrap">
      <div class="table-head"><span>Item</span><span>Qty</span><span>Price</span><span></span></div>
      ${noItems}${rows}
      <div class="table-footer">
        <button class="add-btn" onclick="addItem()">+ Add item</button>
        <span class="total-line">$${total.toFixed(2)} total</span>
      </div>
    </div>
    <div class="split-bar">
      <span>Paid by <strong>${esc(state.extracted.buyer)}</strong></span>
      <span>Each owes <span class="owe">$${(total/2).toFixed(2)}</span></span>
    </div>
    <button class="${btnClass}" onclick="submitEntry()" ${state.stage==="sending"||state.stage==="done"?"disabled":""}>${btnLabel}</button>
    ${!state.settings.scriptUrl ? `<p style="font-size:11px;color:var(--text3);text-align:center;margin-top:8px">No sheet connected — go to Settings to add one.</p>` : ""}
  </div>`;
}

function successHTML() {
  const e = state.lastEntry;
  const total = parseFloat(e.total).toFixed(2);
  return `<div class="view success-wrap">
    <div class="success-icon">✓</div>
    <h2 style="margin-bottom:8px">Logged</h2>
    <p style="font-size:13px;color:var(--text2);margin-bottom:24px">${e.items.length} items · ${esc(e.store)||"unknown store"} · $${total} · ${esc(e.buyer)} paid</p>
    <div class="grid2">
      <button class="btn" onclick="goScan()">Scan another</button>
      <button class="btn" onclick="copyCSV()">Copy CSV</button>
    </div>
  </div>`;
}

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function bindEvents() {}

function toggleHelp() { state.showHelp = !state.showHelp; render(); }
function toggleDebug() { state.showDebug = !state.showDebug; render(); }
function goSetup() { state.view = "setup"; render(); }
function goScan() { state.view = "scan"; state.stage = "idle"; state.debugInfo = null; state.showDebug = false; render(); }
function goManual() { state.extracted = { buyer: state.buyer }; state.items = []; state.store = ""; state.date = new Date().toISOString().split("T")[0]; state.view = "review"; render(); }
function setBuyer(p) { state.buyer = p; render(); }

function saveSetup() {
  const p1 = document.getElementById("p1").value.trim();
  const p2 = document.getElementById("p2").value.trim();
  const url = document.getElementById("url").value.trim();
  const apiKey = document.getElementById("apikey").value.trim();
  if (!p1 || !p2) return;
  state.settings = { person1: p1, person2: p2, scriptUrl: url, apiKey };
  saveSettings(state.settings);
  updateBadge(url);
  state.buyer = p1;
  state.view = "scan";
  render();
}

async function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  state.stage = "compressing"; state.imgData = null; state.debugInfo = null; render();
  try {
    const compressed = await compressImage(file);
    state.imgData = compressed;
    state.stage = "idle";
  } catch(err) {
    state.debugInfo = "Image error: " + err.message;
    state.stage = "error";
  }
  render();
}

async function doScan() {
  if (!state.imgData) return;
  if (!state.settings.apiKey) { state.debugInfo = "No API key set — go to Settings and add your Anthropic API key."; state.stage = "error"; render(); return; }
  state.stage = "scanning"; state.debugInfo = null; state.showDebug = false; render();
  try {
    const today = new Date().toISOString().split("T")[0];
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": state.settings.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{ role: "user", content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: state.imgData.base64 } },
          { type: "text", text: `Look at this receipt image. Extract as much as you can — partial or blurry text is fine.

Return ONLY a raw JSON object, no markdown, no backticks, no extra text:
{"store":"store name or Unknown","date":"YYYY-MM-DD","items":[{"name":"item name","quantity":1,"price":"0.00"}]}

Rules:
- Today is ${today}. Use it for date if unclear.
- Include every product line you can see, even partially readable ones
- Skip tax, subtotal, total, change, card, and address lines
- Use quantity 1 and price 0.00 if values are unclear
- If truly nothing readable, return {"store":"Unknown","date":"${today}","items":[]}` }
        ]}]
      })
    });
    const json = await res.json();
    state.debugInfo = JSON.stringify(json, null, 2);
    if (json.error) { state.stage = "error"; render(); return; }
    const txt = (json.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(txt);
    state.extracted = { ...parsed, buyer: state.buyer };
    state.items = (parsed.items||[]).map((it,i) => ({ ...it, id: i }));
    state.store = parsed.store || "";
    state.date = parsed.date || today;
    state.stage = "idle";
    state.view = "review";
  } catch(err) {
    state.debugInfo = "Error: " + err.message;
    state.stage = "error";
  }
  render();
}

function updateItem(i, k, v) { state.items[i][k] = v; }
function delItem(i) { state.items.splice(i, 1); render(); }
function addItem() { state.items.push({ name: "", quantity: 1, price: "0.00" }); render(); }

async function submitEntry() {
  state.stage = "sending"; render();
  const payload = { buyer: state.extracted.buyer, date: state.date, store: state.store, items: state.items };
  const total = state.items.reduce((s, it) => s + parseFloat(it.price||0), 0);
  if (state.settings.scriptUrl) {
    try { await fetch(state.settings.scriptUrl, { method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) }); } catch {}
  }
  state.lastEntry = { ...payload, total };
  state.stage = "done"; render();
  setTimeout(() => { state.view = "success"; render(); }, 800);
}

function copyCSV() {
  const e = state.lastEntry;
  const csv = [["Buyer","Date","Store","Item","Quantity","Price"], ...e.items.map(i=>[e.buyer,e.date,e.store,i.name,i.quantity,i.price])].map(r=>r.join(",")).join("\n");
  navigator.clipboard.writeText(csv).catch(()=>{});
}

render();
</script>
</body>
</html>
